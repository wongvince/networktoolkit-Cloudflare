name: NetworkToolkit Cloudflare Trial API Deploy

on:
  # Automatic production deployment: merge/push Cloudflare changes to main.
  push:
    branches:
      - main
    paths:
      - 'cloudflare/**'
      - '.github/workflows/deploy-cloudflare.yml'
  # Manual deployment: Actions -> this workflow -> Run workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: networktoolkit-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy Cloudflare Worker + D1
    runs-on: ubuntu-latest
    environment: cloudflare-production
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DATABASE_ID: ${{ vars.CLOUDFLARE_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required GitHub configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing Actions Variable: CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$CLOUDFLARE_DATABASE_ID" || { echo 'Missing Actions Variable: CLOUDFLARE_DATABASE_ID'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Actions Secret: CLOUDFLARE_API_TOKEN'; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Cloudflare Wrangler
        run: npm install --no-save --no-package-lock

      - name: Test Worker source
        run: |
          node --check ./src/index.js
          npm test

      - name: Inject D1 database ID into Wrangler config
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import fs from "node:fs";
            const file = "wrangler.toml";
            const id = process.env.CLOUDFLARE_DATABASE_ID;
            if (!/^[0-9a-fA-F-]{36}$/.test(id)) throw new Error("CLOUDFLARE_DATABASE_ID does not look like a UUID");
            const source = fs.readFileSync(file, "utf8");
            if (!source.includes("REPLACE_WITH_D1_DATABASE_ID") && !source.includes(id)) throw new Error("Unexpected database_id in wrangler.toml");
            fs.writeFileSync(file, source.replace("REPLACE_WITH_D1_DATABASE_ID", id));
          '

      - name: Apply idempotent D1 schema
        run: npx wrangler d1 execute networktoolkit-trials --remote --file=./schema.sql

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Verify production Worker health endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL="https://networktoolkit-trial-api.huangsxint.workers.dev/health"
          echo "Checking $URL"
          for attempt in 1 2 3 4 5; do
            STATUS="$(curl --silent --show-error --output health.json --write-out '%{http_code}' "$URL" || true)"
            if [ "$STATUS" = "200" ] && grep -q '"ok":true' health.json; then
              cat health.json
              echo "Worker health check passed."
              exit 0
            fi
            echo "Health check attempt $attempt returned HTTP ${STATUS:-no-response}."
            cat health.json 2>/dev/null || true
            sleep 5
          done
          echo "Worker deployment completed, but the public health check failed. Check Cloudflare Workers Logs and deployment version."
          exit 1
