name: NetworkToolkit Trial Signing Key Bootstrap

on:
  # Run manually exactly once for the first production setup.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: networktoolkit-cloudflare-production
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Deploy Worker and initialize trial signing key
    runs-on: ubuntu-latest
    environment: cloudflare-production
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DATABASE_ID: ${{ vars.CLOUDFLARE_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required GitHub configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing Actions Variable: CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$CLOUDFLARE_DATABASE_ID" || { echo 'Missing Actions Variable: CLOUDFLARE_DATABASE_ID'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Actions Secret: CLOUDFLARE_API_TOKEN'; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Cloudflare Wrangler
        run: npm install --no-save --no-package-lock

      - name: Inject D1 database ID into Wrangler config
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import fs from "node:fs";
            const file = "wrangler.toml";
            const id = process.env.CLOUDFLARE_DATABASE_ID;
            if (!/^[0-9a-fA-F-]{36}$/.test(id)) throw new Error("CLOUDFLARE_DATABASE_ID does not look like a UUID");
            const source = fs.readFileSync(file, "utf8");
            if (!source.includes("REPLACE_WITH_D1_DATABASE_ID") && !source.includes(id)) throw new Error("Unexpected database_id in wrangler.toml");
            fs.writeFileSync(file, source.replace("REPLACE_WITH_D1_DATABASE_ID", id));
          '

      - name: Apply D1 schema
        run: npx wrangler d1 execute networktoolkit-trials --remote --file=./schema.sql

      - name: Deploy Worker before setting its first secret
        run: npx wrangler deploy

      - name: Generate one-time Ed25519 keypair and store private key in Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          set +x
          KEY_FILE="$RUNNER_TEMP/networktoolkit-trial-private-key.b64"
          export KEY_FILE
          node --input-type=module <<'NODE'
          import { webcrypto } from 'node:crypto';
          import fs from 'node:fs';
          const pair = await webcrypto.subtle.generateKey({ name: 'Ed25519' }, true, ['sign', 'verify']);
          const privateDer = Buffer.from(await webcrypto.subtle.exportKey('pkcs8', pair.privateKey));
          const publicDer = Buffer.from(await webcrypto.subtle.exportKey('spki', pair.publicKey));
          const privateB64 = privateDer.toString('base64');
          const publicB64 = publicDer.toString('base64');
          fs.writeFileSync(process.env.KEY_FILE, privateB64, { mode: 0o600 });
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '## NetworkToolkit trial public key\n\n' +
            'Copy this **public** key into `TRIAL_PUBLIC_KEY_B64` in `src/main/kotlin/com/networktoolkit/Main.kt`, then commit and build the Windows client.\n\n' +
            '```text\n' + publicB64 + '\n```\n\n' +
            '**Private key:** generated on the temporary GitHub-hosted runner and sent directly to the Cloudflare Worker Secret `TRIAL_SIGNING_PRIVATE_KEY_B64`. It is not printed in the logs or stored in the repository.\n\n' +
            '**Important:** run this bootstrap workflow only once. Running it again rotates the signing key and makes existing client public keys unable to verify newly issued tokens.\n');
          NODE
          npx wrangler secret put TRIAL_SIGNING_PRIVATE_KEY_B64 < "$KEY_FILE"
          rm -f "$KEY_FILE"
